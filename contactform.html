<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Form</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="contactform.css"/>
</head>
<body>
  <div class="card">
    <h1 class="heading">Get in Touch</h1>
    <p class="subtext">Fill in the form below and we'll get back to you.</p>

    <div id="form-area">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="e.g. John Doe" />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+254 700 000 000" />
      </div>

      <div class="field">
        <label for="subject">Subject Line</label>
        <input type="text" id="subject" placeholder="What's this about?" />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message here..."></textarea>
      </div>

      <button class="btn" onclick="sendMessage()">Send Message</button>
    </div>
  </div>

</html>
